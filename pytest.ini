[tool:pytest]
# pytest配置文件

# 测试发现
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# 测试路径
testpaths = tests

# 最小版本
minversion = 6.0

# 添加选项
addopts = 
    -v
    --strict-markers
    --strict-config
    --tb=short
    --cov=src
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-fail-under=80
    --durations=10

# 标记定义
markers =
    unit: 单元测试，不需要外部依赖
    integration: 集成测试，需要真实浏览器
    slow: 慢速测试
    network: 需要网络连接的测试
    smoke: 冒烟测试
    regression: 回归测试
    performance: 性能测试

# 过滤警告
filterwarnings =
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 文件日志
log_file = tests.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d %(funcName)s(): %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S

# 自动使用的插件
required_plugins =
    pytest-cov
    pytest-html
    pytest-xdist

# 并行测试
# 使用 -n auto 或 -n <number> 来启用
# addopts = -n auto

# 测试超时（秒）
timeout = 300

# JUnit XML报告
# junit_family = xunit2
# junit_logging = all
# junit_log_passing_tests = false

# HTML报告
# --html=report.html --self-contained-html

# 覆盖率配置
# 在 .coveragerc 或 pyproject.toml 中配置更详细的覆盖率选项