[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpa-automation-test"
version = "1.0.0"
description = "基于Python和Selenium的RPA自动化测试框架"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "RPA Team", email = "rpa-team@example.com"},
]
maintainers = [
    {name = "RPA Team", email = "rpa-team@example.com"},
]
keywords = ["rpa", "automation", "testing", "selenium", "webdriver", "browser"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "selenium>=4.15.0",
    "webdriver-manager>=4.0.1",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "openpyxl>=3.1.0",
    "Pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "pytesseract>=0.3.10",
    "requests>=2.31.0",
    "urllib3>=2.0.0",
    "PyYAML>=6.0",
    "configparser>=5.3.0",
    "loguru>=0.7.0",
    "python-dateutil>=2.8.0",
    "psycopg2-binary>=2.9.0",
    "PyMySQL>=1.1.0",
    "requests-toolbelt>=1.0.0",
    "jsonschema>=4.19.0",
    "allure-pytest>=2.13.0",
    "pytest-html>=4.0.0",
    "cryptography>=41.0.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-html>=4.0.0",
    "pytest-xdist>=3.3.0",
    "pytest-mock>=3.11.0",
    "pytest-timeout>=2.1.0",
    "flake8>=6.0.0",
    "black>=23.7.0",
    "isort>=5.12.0",
    "mypy>=1.5.0",
    "pylint>=2.17.0",
    "bandit>=1.7.0",
    "pre-commit>=3.3.0",
]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-html>=4.0.0",
    "pytest-xdist>=3.3.0",
    "pytest-mock>=3.11.0",
    "pytest-timeout>=2.1.0",
]
docs = [
    "sphinx>=7.1.0",
    "sphinx-rtd-theme>=1.3.0",
    "sphinx-autodoc-typehints>=1.24.0",
]

[project.urls]
"Homepage" = "https://github.com/Baijack-star/rpa-test"
"Bug Reports" = "https://github.com/Baijack-star/rpa-test/issues"
"Source" = "https://github.com/Baijack-star/rpa-test"
"Documentation" = "https://github.com/Baijack-star/rpa-test/wiki"
"Changelog" = "https://github.com/Baijack-star/rpa-test/blob/main/CHANGELOG.md"

[project.scripts]
rpa-test = "src.cli:main"

[tool.setuptools]
packages = ["src", "src.automation", "src.utils", "src.config"]

[tool.setuptools.package-data]
"src" = ["config/*.yaml", "config/*.yml", "config/*.json", "templates/*.html", "templates/*.xml"]

# Black配置
[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
(
  /(
      \.eggs
    | \.git
    | \.hg
    | \.mypy_cache
    | \.tox
    | \.venv
    | _build
    | buck-out
    | build
    | dist
  )/
)
'''

# isort配置
[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

# mypy配置
[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "selenium.*",
    "webdriver_manager.*",
    "cv2.*",
    "pytesseract.*",
]
ignore_missing_imports = true

# pytest配置
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
markers = [
    "unit: 单元测试，不需要外部依赖",
    "integration: 集成测试，需要真实浏览器",
    "slow: 慢速测试",
    "network: 需要网络连接的测试",
    "smoke: 冒烟测试",
    "regression: 回归测试",
    "performance: 性能测试",
]
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

# coverage配置
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__init__.py",
    "*/setup.py",
    "*/conftest.py",
]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\bProtocol\):",
    "@(abc\.)?abstractmethod",
]
ignore_errors = true

[tool.coverage.html]
directory = "htmlcov"

# bandit配置
[tool.bandit]
exclude_dirs = ["tests", "test_*"]
skips = ["B101", "B601"]

# pylint配置
[tool.pylint.messages_control]
disable = [
    "C0330",  # Wrong hanging indentation
    "C0326",  # Bad whitespace
    "R0903",  # Too few public methods
    "R0913",  # Too many arguments
    "W0613",  # Unused argument
    "W0622",  # Redefined builtin
]

[tool.pylint.format]
max-line-length = 88

[tool.pylint.design]
max-args = 10
max-locals = 20
max-returns = 10
max-branches = 15
max-statements = 60
max-parents = 10
max-attributes = 15
min-public-methods = 1
max-public-methods = 25
max-bool-expr = 5

[tool.pylint.similarities]
min-similarity-lines = 4
ignore-comments = true
ignore-docstrings = true
ignore-imports = false

# flake8配置（在setup.cfg中）
# 这里只是文档说明，实际配置在setup.cfg

# 构建配置
[tool.setuptools_scm]
write_to = "src/_version.py"

# 依赖检查
[tool.pip-audit]
requirements-file = "requirements_rpa.txt"
format = "json"
output = "audit-report.json"

# 安全扫描
[tool.safety]
full-report = true
short-report = false
output = "json"
file = "safety-report.json"